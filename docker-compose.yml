# Two services plus a database:
#   db       — PostgreSQL, the only stateful piece
#   frontend — Next.js app; owns the schema, migrations, and all data access
#   nginx    — reverse proxy / TLS termination
#
# Local dev:   docker compose up -d db  &&  cd frontend && npm run dev
# Full stack:  docker compose --profile full up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: portfolio-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      # REMINDER: Change POSTGRES_PASSWORD in .env before deploying to production!
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio}"]
      interval: 10s
      retries: 5

  frontend:
    build: ./frontend
    container_name: portfolio-frontend
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Inside the compose network the database host is `db`, not localhost.
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://portfolio:portfolio@db:5432/portfolio}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-0.1.0}

  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8090}:80"
      - "${HTTPS_PORT:-8453}:443"
    volumes:
      # ./nginx/local.conf serves plain HTTP; set NGINX_CONF=./nginx/default.conf
      # in .env for the production TLS vhost.
      - ${NGINX_CONF:-./nginx/local.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/letsencrypt:ro
    depends_on:
      - frontend

volumes:
  postgres_data:
